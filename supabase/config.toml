project_id = "plates-and-pace"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# The current Supabase CLI refuses 16 here; local Postgres 16 still runs the
# same migrations, which use nothing version-specific.
major_version = 17

[studio]
enabled = true
port = 54323

# Catches the magic-link and confirmation emails locally so onboarding can be
# walked through end to end without sending real mail.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/en/auth/callback",
  "http://localhost:3000/es/auth/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Google sign-in is configured but left off until credentials exist, so the
# local stack starts without them (PLAN.md §14).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
