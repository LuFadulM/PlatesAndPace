name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PLAN.md §5: the suite runs under a hostile host zone so a latent UTC
        # assumption in the date engine cannot pass unnoticed.
        tz: [UTC, Pacific/Kiritimati]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a real Postgres and then proves the policies
      # hold: one user cannot read, or write into, another user's rows
      # (PLAN.md §11.4 spec 5).
      - name: Apply migrations and run the RLS suite
        env:
          PGPASSWORD: postgres
          PSQL_ARGS: -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q
        run: |
          set -euo pipefail
          psql $PSQL_ARGS -f supabase/tests/_shim.sql
          for migration in supabase/migrations/*.sql; do
            echo "applying $migration"
            psql $PSQL_ARGS -f "$migration"
          done
          psql $PSQL_ARGS -f supabase/tests/rls.test.sql

  e2e:
    name: End to end (390px, en + es)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Local Supabase: migrations + seed, then expose its keys to the app and
      # the specs. The isolation spec needs the service role to set up the two
      # users it proves cannot see each other.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector
      # `supabase status -o env` names its keys differently across CLI
      # versions (ANON_KEY / SERVICE_ROLE_KEY, or PUBLISHABLE_KEY / SECRET_KEY),
      # so resolve them in the shell with fallbacks rather than trusting one
      # spelling from the workflow.
      - name: Build and test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test -n "$NEXT_PUBLIC_SUPABASE_URL" -a -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" -a -n "$SUPABASE_SERVICE_ROLE_KEY"
          npm run build
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
